server:
  port: 8080

spring:
  application:
    name: hospital-queue

  datasource:
    url: jdbc:postgresql://localhost:5432/hospital_queue
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate   # schema is owned by Flyway, not Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  thymeleaf:
    cache: false          # disable during development for live template reload
